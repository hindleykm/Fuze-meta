name: Node.js Setup and Deployment

on:
  push:
    branches:
      - main 
      
  workflow_dispatch:
    inputs:
      your-input-name:
        description: 'Your input description'
        required: false


jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Git
        run: |
          sudo apt-get update && sudo apt-get install git
      - name: Install dependencies
        run: |
          npm install moment simple-git random jsonfile



      - name: Configure Git
        run: |
          git config --global user.name "hindleykm"
          git config --global user.email "AnnetteHeidegger309815@outlook.com"


      - name: Run Node.js script
        env:
          GIT_AUTHOR_NAME: "hindleykm"
          GIT_AUTHOR_EMAIL: "AnnetteHeidegger309815@outlook.com"
          GIT_COMMITTER_NAME: "hindleykm"
          GIT_COMMITTER_EMAIL: "AnnetteHeidegger309815@outlook.com"
        run: |
          node index.js
          

      - name: Push changes
        run: |
          git push -f origin main
